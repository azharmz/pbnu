<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>turnamen Intern PB. NU 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --card-bg: #0f3460;
      --item-bg: #1e2d4a;
      --item-hover: #263656;
      --border: #2a4070;
      --accent: #e2b714;
      --text: #e8eaf0;
      --muted: #8896b0;
      --danger: #e05555;
      --pool-a: #e2b714;
      --pool-b: #4ecdc4;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(90deg,#0f3460,#1a1a2e);
      border-bottom: 2px solid var(--accent);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      position: sticky; top: 0; z-index: 200;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    h1 { font-family: 'Bebas Neue', cursive; font-size: 22px; letter-spacing: 2px; color: var(--accent); }
    .badge {
      background: rgba(226,183,20,0.15); border: 1px solid var(--accent);
      color: var(--accent); font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .status-bar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .status-dot.online  { background: #4caf7d; box-shadow: 0 0 6px #4caf7d; }
    .status-dot.offline { background: var(--danger); }

    /* EDIT BUTTON in header */
    .btn-edit-toggle {
      background: var(--item-bg); border: 1px solid var(--border);
      color: var(--muted); border-radius: 8px; padding: 6px 14px;
      font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .btn-edit-toggle.active { background: var(--accent); border-color: var(--accent); color: #0d0f14; font-weight: 600; }

    /* CONFIG */
    .config-panel { background: #0a0c10; border-bottom: 1px solid var(--border); padding: 10px 20px; display: none; }
    .config-panel.unlocked { display: block; }
    .config-panel summary {
      cursor: pointer; font-size: 13px; color: var(--muted);
      list-style: none; display: flex; align-items: center; gap: 6px;
    }
    .config-panel summary::-webkit-details-marker { display: none; }
    .config-fields { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .config-fields input {
      flex: 1; min-width: 200px;
      background: var(--item-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none;
    }
    .config-fields input:focus { border-color: var(--accent); }
    .btn-save {
      background: var(--accent); color: #0d0f14; border: none;
      border-radius: 8px; padding: 8px 18px; font-size: 13px;
      font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }

    /* MODAL OVERLAY */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 500;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 24px; width: 90%; max-width: 360px;
      text-align: center;
    }
    .modal h2 { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--accent); margin-bottom: 6px; letter-spacing: 1px; }
    .modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .modal input {
      width: 100%; background: var(--item-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; color: var(--text);
      font-size: 16px; font-family: 'DM Sans', sans-serif; outline: none;
      text-align: center; letter-spacing: 3px; margin-bottom: 14px;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal-btns { display: flex; gap: 10px; }
    .btn-confirm {
      flex: 1; background: var(--accent); color: #0d0f14;
      border: none; border-radius: 10px; padding: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-cancel {
      flex: 1; background: var(--item-bg); color: var(--muted);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px;
      font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .modal-error { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px; }

    /* POOLS */
    .pools-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    @media (max-width: 600px) { .pools-wrapper { grid-template-columns: 1fr; } }

    .pool { background: var(--card-bg); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .pool-header {
      padding: 12px 16px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border);
    }
    .pool-title { font-family: 'Bebas Neue', cursive; font-size: 20px; letter-spacing: 1px; }
    .pool-a .pool-title { color: var(--pool-a); }
    .pool-b .pool-title { color: var(--pool-b); }
    .pool-count { font-size: 12px; color: var(--muted); background: var(--item-bg); padding: 2px 8px; border-radius: 12px; }

    /* ADD ROW — hidden by default */
    .add-row {
      display: none;
      gap: 8px; padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
    }
    .add-row.visible { display: flex; }
    .add-row input {
      flex: 1; background: var(--item-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; color: var(--text);
      font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }
    .add-row input::placeholder { color: var(--muted); font-size: 13px; }
    .btn-add-sm {
      background: var(--accent); color: #0d0f14; border: none;
      border-radius: 8px; padding: 8px 12px; font-size: 18px;
      font-weight: 700; cursor: pointer; line-height: 1; flex-shrink: 0;
    }
    .btn-add-sm:active { transform: scale(0.9); }

    /* PLAYER LIST */
    .player-list { padding: 8px; flex: 1; }
    .player-item {
      background: var(--item-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px;
      user-select: none; touch-action: none;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .player-item:last-child { margin-bottom: 0; }
    .player-item.editable { cursor: grab; }
    .player-item.editable:active { cursor: grabbing; }
    .player-item.dragging { opacity: 0.3; transform: scale(0.97); }
    .player-item.drag-over {
      background: var(--item-hover); border-color: var(--accent);
      transform: translateY(-2px); box-shadow: 0 6px 18px rgba(226,183,20,0.15);
    }

    .drag-handle { color: var(--border); font-size: 16px; flex-shrink: 0; display: none; }
    .editable .drag-handle { display: block; }

    .rank-num { font-family: 'Bebas Neue', cursive; font-size: 16px; color: var(--muted); width: 20px; text-align: center; flex-shrink: 0; }
    .pool-a .rank-num.top { color: var(--pool-a); }
    .pool-b .rank-num.top { color: var(--pool-b); }

    .player-name-text { flex: 1; font-size: 15px; font-weight: 500; }

    .btn-del {
      display: none; background: none; border: none;
      color: var(--border); font-size: 18px; cursor: pointer;
      padding: 2px 5px; border-radius: 5px; line-height: 1;
    }
    .editable .btn-del { display: block; }
    .btn-del:hover { color: var(--danger); }

    .empty-item { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 13px; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--item-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 18px; font-size: 14px; color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); transition: transform 0.3s; z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>🔐 Mode Edit</h2>
    <p>Masukkan password untuk mengaktifkan mode edit</p>
    <input type="password" id="passInput" placeholder="••••••••" maxlength="30" />
    <div class="modal-error" id="passError"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-confirm" onclick="checkPassword()">Masuk</button>
    </div>
  </div>
</div>

<header>
  <div class="header-left">
    <span style="font-size:22px">🏸</span>
    <h1>TURNAMEN INTERN PB. NU 2026</h1>
    <span class="badge">BADMINTON</span>
  </div>
  <div class="header-right">
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Menghubungkan...</span>
    </div>
    <button class="btn-edit-toggle" id="btnEditToggle" onclick="toggleEdit()">🔒 Edit</button>
  </div>
</header>

<details class="config-panel" id="configPanel">
  <summary>⚙️ &nbsp;Pengaturan Firebase &nbsp;▾</summary>
  <div class="config-fields">
    <input type="text" id="dbUrl" placeholder="https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app" />
    <button class="btn-save" onclick="saveConfig()">Simpan & Hubungkan</button>
  </div>
</details>

<div class="pools-wrapper">
  <div class="pool pool-a" id="pool-ab">
    <div class="pool-header">
      <div class="pool-title">Pool A/B</div>
      <div class="pool-count" id="count-ab">0 pemain</div>
    </div>
    <div class="add-row" id="addrow-ab">
      <input type="text" id="input-ab" placeholder="Tambah nama..." maxlength="40" />
      <button class="btn-add-sm" onclick="addPlayer('ab')">+</button>
    </div>
    <div class="player-list" id="list-ab"><div class="empty-item">Belum ada pemain</div></div>
  </div>

  <div class="pool pool-b" id="pool-cd">
    <div class="pool-header">
      <div class="pool-title">Pool C/D</div>
      <div class="pool-count" id="count-cd">0 pemain</div>
    </div>
    <div class="add-row" id="addrow-cd">
      <input type="text" id="input-cd" placeholder="Tambah nama..." maxlength="40" />
      <button class="btn-add-sm" onclick="addPlayer('cd')">+</button>
    </div>
    <div class="player-list" id="list-cd"><div class="empty-item">Belum ada pemain</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


  window._fb = { db: null, ref, set, onValue };

  window.initFirebase = function(url) {
    try {
      const app = initializeApp({ databaseURL: url }, 'pb-nu-' + Date.now());
      window._fb.db = getDatabase(app);
      setStatus(true);
      return true;
    } catch(e) { console.error(e); setStatus(false); return false; }
  };

</script>

<script>
  // ── CONFIG: ganti PASSWORD di sini ───────────────────────
  const EDIT_PASSWORD = 'pbnu2026';
  // ─────────────────────────────────────────────────────────

  const pools = { ab: [], cd: [] };
  let unsubs = {};
  let dragSrc = { pool: null, index: null };
  let isEditMode = false;

  // ── STATUS ───────────────────────────────────────────────
  function setStatus(on) {
    document.getElementById('statusDot').className = 'status-dot ' + (on ? 'online' : 'offline');
    document.getElementById('statusText').textContent = on ? 'Terhubung' : 'Tidak terhubung';
  }
  window.setStatus = setStatus;

  // ── CONFIG ───────────────────────────────────────────────
  window.saveConfig = async function() {
    const url = document.getElementById('dbUrl').value.trim();
    if (!url.startsWith('https://')) { showToast('❌ URL tidak valid'); return; }
    localStorage.setItem('fb_url', url);
    const ok = await window.initFirebase(url);
    if (ok) {
      document.getElementById('configPanel').removeAttribute('open');
      showToast('✅ Terhubung!');
      listenAll();
    } else { showToast('❌ Gagal terhubung'); }
  };

  // ── EDIT MODE & PASSWORD ──────────────────────────────────
  window.toggleEdit = function() {
    if (isEditMode) {
      // Keluar edit mode
      isEditMode = false;
      applyEditMode();
    } else {
      openModal();
    }
  };

  function openModal() {
    document.getElementById('passInput').value = '';
    document.getElementById('passError').textContent = '';
    document.getElementById('modalOverlay').classList.add('show');
    setTimeout(() => document.getElementById('passInput').focus(), 100);
  }

  window.closeModal = function() {
    document.getElementById('modalOverlay').classList.remove('show');
  };

  window.checkPassword = async function() {
    const val = document.getElementById('passInput').value;
    if (val === EDIT_PASSWORD) {
      document.getElementById('modalOverlay').classList.remove('show');
      // Sign in anonymously agar Firebase rules terpenuhi
      isEditMode = true;
      applyEditMode();
      showToast('🔓 Mode edit aktif');
    } else {
      document.getElementById('passError').textContent = '❌ Password salah';
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }
  };

  document.getElementById('passInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.checkPassword();
    if (e.key === 'Escape') window.closeModal();
  });

  function applyEditMode() {
    const btn = document.getElementById('btnEditToggle');
    btn.textContent = isEditMode ? '🔓 Edit' : '🔒 Edit';
    btn.classList.toggle('active', isEditMode);
    document.getElementById('configPanel').classList.toggle('unlocked', isEditMode);
    if (!isEditMode) document.getElementById('configPanel').removeAttribute('open');
    ['ab','cd'].forEach(pool => {
      document.getElementById('addrow-' + pool).classList.toggle('visible', isEditMode);
    });
    render('ab');
    render('cd');
  }

  // ── FIREBASE ─────────────────────────────────────────────
  function listenAll() {
    ['ab','cd'].forEach(pool => {
      if (unsubs[pool]) unsubs[pool]();
      const r = window._fb.ref(window._fb.db, 'pools/' + pool);
      unsubs[pool] = window._fb.onValue(r, snap => {
        const d = snap.val();
        pools[pool] = d ? Object.values(d) : [];
        render(pool);
      });
    });
  }

  async function save(pool) {
    if (!window._fb.db) return;
    const obj = {};
    pools[pool].forEach((p,i) => { obj[i] = p; });
    await window._fb.set(window._fb.ref(window._fb.db, 'pools/' + pool), obj);
  }

  // ── ADD / DELETE ──────────────────────────────────────────
  window.addPlayer = async function(pool) {
    if (!isEditMode) return;
    const input = document.getElementById('input-' + pool);
    const name = input.value.trim();
    if (!name) return;
    if (!window._fb.db) { showToast('⚠️ Hubungkan Firebase dulu'); return; }
    pools[pool].push(name);
    input.value = '';
    await save(pool);
    showToast('✅ Ditambahkan');
  };

  window.deletePlayer = async function(pool, i) {
    if (!isEditMode) return;
    pools[pool].splice(i, 1);
    await save(pool);
    showToast('🗑️ Dihapus');
  };

  ['ab','cd'].forEach(pool => {
    document.getElementById('input-' + pool).addEventListener('keydown', e => {
      if (e.key === 'Enter') window.addPlayer(pool);
    });
    document.getElementById('input-' + pool).addEventListener('paste', async e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      const names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      if (names.length <= 1) {
        document.getElementById('input-' + pool).value = names[0] || '';
        return;
      }
      if (!window._fb.db) { showToast('⚠️ Hubungkan Firebase dulu'); return; }
      names.forEach(n => pools[pool].push(n.substring(0, 40)));
      await save(pool);
      showToast('✅ ' + names.length + ' pemain ditambahkan');
    });
  });

  // ── DRAG & DROP ───────────────────────────────────────────
  function addDrag(el, pool, index) {
    if (!isEditMode) return;

    el.addEventListener('dragstart', () => {
      dragSrc = { pool, index };
      setTimeout(() => el.classList.add('dragging'), 0);
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', async e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      if (!dragSrc.pool || (dragSrc.pool === pool && dragSrc.index === index)) return;
      const name = pools[dragSrc.pool].splice(dragSrc.index, 1)[0];
      pools[pool].splice(index, 0, name);
      const sp = dragSrc.pool;
      dragSrc = { pool: null, index: null };
      await save(pool);
      if (sp !== pool) await save(sp);
    });

    // Touch
    let tsIdx = index, tsPool = pool;
    el.addEventListener('touchstart', () => {
      tsIdx = index; tsPool = pool;
      el.classList.add('dragging');
    }, { passive: true });
    el.addEventListener('touchmove', e => {
      e.preventDefault();
      const y = e.touches[0].clientY;
      document.querySelectorAll('.player-item').forEach(c => {
        c.classList.remove('drag-over');
        const r = c.getBoundingClientRect();
        if (y >= r.top && y <= r.bottom) c.classList.add('drag-over');
      });
    }, { passive: false });
    el.addEventListener('touchend', async e => {
      el.classList.remove('dragging');
      const y = e.changedTouches[0].clientY;
      const items = [...document.querySelectorAll('.player-item')];
      items.forEach(c => c.classList.remove('drag-over'));
      let tEl = null;
      items.forEach(c => {
        const r = c.getBoundingClientRect();
        if (y >= r.top && y <= r.bottom) tEl = c;
      });
      if (!tEl) return;
      const tPool = tEl.dataset.pool;
      const tIdx = parseInt(tEl.dataset.index);
      if (tPool === tsPool && tIdx === tsIdx) return;
      const name = pools[tsPool].splice(tsIdx, 1)[0];
      pools[tPool].splice(tIdx, 0, name);
      const sp = tsPool;
      await save(tPool);
      if (sp !== tPool) await save(sp);
    });
  }

  // ── RENDER ────────────────────────────────────────────────
  function render(pool) {
    const container = document.getElementById('list-' + pool);
    const countEl = document.getElementById('count-' + pool);
    const list = pools[pool];
    countEl.textContent = list.length + ' pemain';

    if (list.length === 0) {
      container.innerHTML = '<div class="empty-item">Belum ada pemain</div>';
      return;
    }

    container.innerHTML = '';
    list.forEach((name, i) => {
      const el = document.createElement('div');
      el.className = 'player-item' + (isEditMode ? ' editable' : '');
      el.draggable = isEditMode;
      el.dataset.pool = pool;
      el.dataset.index = i;
      el.innerHTML = `
        <div class="drag-handle">⠿</div>
        <div class="rank-num">${i + 1}</div>
        <div class="player-name-text">${esc(name)}</div>
        <button class="btn-del" onclick="deletePlayer('${pool}',${i})">×</button>
      `;
      addDrag(el, pool, i);
      container.appendChild(el);
    });
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── TOAST ─────────────────────────────────────────────────
  let tt;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(tt);
    tt = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── INIT ──────────────────────────────────────────────────
  const FIREBASE_URL = 'https://pbnu-3dd18-default-rtdb.asia-southeast1.firebasedatabase.app';
  document.getElementById('dbUrl').value = FIREBASE_URL;
  setTimeout(() => {
    const ok = window.initFirebase(FIREBASE_URL);
    if (ok) listenAll();
    else { render('ab'); render('cd'); }
  }, 400);
</script>
</body>
</html>
